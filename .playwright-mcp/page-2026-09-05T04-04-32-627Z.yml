      - region "Start" [ref=e125]:
        - heading "Read something." [level=2] [ref=e126]
        - paragraph [ref=e127]: Something is a local-first reader. You drop a file in. You read it. You leave. You come back. You are still there.
        - paragraph [ref=e128]: It does not care whether the file was an EPUB, a PDF, a Markdown note, or a paragraph you pasted because someone sent you an 83-page report.
      - region "Why this exists" [ref=e129]:
        - heading "Why this exists" [level=2] [ref=e130]
        - paragraph [ref=e131]: Most readers want an account, a catalog, or a weekly fee before they will open a file you already have. That is a strange way to treat a document.
        - paragraph [ref=e132]: This sample is here so the first screen is never a lecture. It is a page.
      - region "Focus mode" [ref=e133]:
        - heading "Focus mode" [level=2] [ref=e134]
        - paragraph [ref=e135]: Focus shows one word at a time, aligned on a pivot letter. That is a real perceptual trick. It is not a license to claim you now read three times faster with perfect memory.
        - paragraph [ref=e136]: Use it when you want the words to come to you. Switch back when you need to look around.
      - region "The deal" [ref=e137]:
        - heading "The deal" [level=2] [ref=e138]
        - paragraph [ref=e139]: • Your files stay in this browser. • Progress is saved when you pause, scroll, or leave. • There is no cloud in the way of the first sentence.
